[package]
name = "lucie"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]

[lints]
workspace = true

[features]
default = ["font-kit", "wayland", "x11"]
test-support = [
    "leak-detection",
    "tokio/test-util",
    # "http_client/test-support",
    "wayland",
    "x11",
]
leak-detection = ["dep:backtrace"]
wayland = [ "bitflags" ]
x11 = []

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
lucie-common.workspace = true
lucie-macros.workspace = true
lucie-style.workspace = true
lucie-text.workspace = true

anyhow.workspace = true
async-task = "4.7"
backtrace = { version = "0.3", optional = true }
bitflags = { version = "2.6", optional = true }
bytemuck = { version = "1", optional = true }
derive_more.workspace = true
futures-core.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = [ "rt", "rt-multi-thread", "time", "sync", "io-util" ] }
tokio-stream = { workspace = true }
image.workspace = true
inventory = "0.3.19"
itertools.workspace = true
tracing.workspace = true
num_cpus = "1.13"
parking_lot.workspace = true
profiling = "1"
pin-project-lite = "0.2"
fastrand.workspace = true
raw-window-handle.workspace = true
resvg = { version = "0.47.0", default-features = false }
usvg = { version = "0.47.0", default-features = false }
rapidhash.workspace = true
slotmap = "1.0.6"
smallvec.workspace = true
stacksafe = "1.0"
taffy = { version = "0.11", default-features = false, features = [
	"std",
	"taffy_tree",
	"flexbox",
	"grid",
	"block_layout",
	"content_size"
] }
thiserror = "2.0.12"
lyon_tessellation = "1.0"
lyon_algorithms = "1.0"
circular-buffer = "1.0"
bytes.workspace = true
http.workspace = true
http-body.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa.workspace = true
cocoa-foundation.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics = "0.24"
core-video.workspace = true
core-text = "21"
ctor = { version = "0.6", default-features = false, features = [ "proc_macro" ]}
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
media.workspace = true
objc.workspace = true
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
mach2.workspace = true
#TODO: replace with "objc2"
metal.workspace = true
flume = "0.12"
semver = "1.0"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
blade-graphics = { workspace = true, optional = true }
blade-macros = { workspace = true, optional = true }
blade-util = { workspace = true, optional = true }
pathfinder_geometry = "0.5"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [ "Win32_Foundation" ] }

[dev-dependencies]
backtrace = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = [ "std", "fmt" ] }
lyon = { version = "1.0", features = ["extra"] }
reqwest_client = { workspace = true, features = ["test-support"] }
unicode-segmentation = "1.10"
lucie-platform.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.71"
cbindgen = { version = "0.28.0", default-features = false }
naga.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.build-dependencies]
naga.workspace = true


[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "image"
path = "examples/image/image.rs"

[[example]]
name = "input"
path = "examples/input.rs"

[[example]]
name = "on_window_close_quit"
path = "examples/on_window_close_quit.rs"

[[example]]
name = "opacity"
path = "examples/opacity.rs"

[[example]]
name = "pattern"
path = "examples/pattern.rs"

[[example]]
name = "set_menus"
path = "examples/set_menus.rs"

[[example]]
name = "shadow"
path = "examples/shadow.rs"

[[example]]
name = "svg"
path = "examples/svg/svg.rs"

[[example]]
name = "tab_stop"
path = "examples/tab_stop.rs"

[[example]]
name = "text"
path = "examples/text.rs"

[[example]]
name = "text_wrapper"
path = "examples/text_wrapper.rs"

[[example]]
name = "tree"
path = "examples/tree.rs"

[[example]]
name = "uniform_list"
path = "examples/uniform_list.rs"

[[example]]
name = "window_shadow"
path = "examples/window_shadow.rs"

[[example]]
name = "grid_layout"
path = "examples/grid_layout.rs"
